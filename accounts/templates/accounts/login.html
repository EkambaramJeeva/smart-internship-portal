<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Internship Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">
                Smart Internship Portal
            </span>

            <a
                href="{% url 'register' %}"
                class="btn btn-light">

                Create Account

            </a>

        </div>

    </nav>


    <!-- Login Section -->

    <div class="container">

        <div
            class="row justify-content-center align-items-center"
            style="min-height: 80vh;">

            <div class="col-md-6 col-lg-5">


                <div class="card shadow-sm border-0">

                    <div class="card-body p-5">


                        <!-- Heading -->

                        <div class="text-center mb-4">

                            <div class="display-5 mb-3">
                                🔐
                            </div>

                            <h2 class="fw-bold">
                                Welcome Back
                            </h2>

                            <p class="text-muted">
                                Login to your Smart Internship Portal account.
                            </p>

                        </div>


                        <!-- Messages -->

                        {% if messages %}

                            {% for message in messages %}

                                <div
                                    class="alert alert-danger"
                                    role="alert">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}


                        <!-- Login Form -->

                        <form method="POST">

                            {% csrf_token %}


                            <!-- Username -->

                            <div class="mb-3">

                                <label
                                    for="username"
                                    class="form-label fw-bold">

                                    Username

                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                    class="form-control"
                                    placeholder="Enter your username"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label fw-bold">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Login Button -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    🔐 Login

                                </button>

                            </div>


                        </form>


                        <!-- Register -->

                        <div class="text-center mt-4">

                            <p class="text-muted mb-2">
                                Don't have an account?
                            </p>

                            <a
                                href="{% url 'register' %}"
                                class="btn btn-outline-primary">

                                Create New Account

                            </a>

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
